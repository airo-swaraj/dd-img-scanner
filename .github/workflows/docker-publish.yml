name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: dd-img-scanner

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_SITE: ${{ secrets.DD_SITE }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, push, scan, and publish digest
        run: |
          set -euo pipefail

          CLEAN_USERNAME="$(echo "${DOCKERHUB_USERNAME}" | tr -d '[:space:]')"
          if [ -z "${CLEAN_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is missing."
            exit 1
          fi
          if [ -z "${DD_API_KEY}" ] || [ -z "${DD_APP_KEY}" ]; then
            echo "DD_API_KEY or DD_APP_KEY is missing."
            exit 1
          fi

          EFFECTIVE_SITE="${DD_SITE:-datadoghq.com}"
          EFFECTIVE_SITE="${EFFECTIVE_SITE#https://}"
          EFFECTIVE_SITE="${EFFECTIVE_SITE#http://}"
          EFFECTIVE_SITE="${EFFECTIVE_SITE%/}"
          if [ "${EFFECTIVE_SITE}" = "app.datadoghq.com" ]; then
            EFFECTIVE_SITE="datadoghq.com"
          elif [ "${EFFECTIVE_SITE}" = "app.datadoghq.eu" ]; then
            EFFECTIVE_SITE="datadoghq.eu"
          elif [ "${EFFECTIVE_SITE}" = "app.ddog-gov.com" ]; then
            EFFECTIVE_SITE="ddog-gov.com"
          fi

          IMAGE="${CLEAN_USERNAME}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          FULL_SHA="${GITHUB_SHA}"
          IMAGE_REF="${IMAGE}:${SHORT_SHA}"

          echo "${DOCKERHUB_TOKEN}" | docker login -u "${CLEAN_USERNAME}" --password-stdin

          docker buildx build \
            --push \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "com.datadoghq.image.source_path=Dockerfile" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "com.datadoghq.image.source_path=Dockerfile" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHORT_SHA}" \
            -t "${IMAGE}:${FULL_SHA}" \
            .

          docker pull "${IMAGE_REF}"
          RUNTIME_REPO_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}")"
          RUNTIME_DIGEST="${RUNTIME_REPO_DIGEST#*@}"

          DD_APT_KEY_URL="https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public"
          curl -fsSL "$DD_APT_KEY_URL" | sudo gpg --dearmor -o /usr/share/keyrings/datadog-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/datadog-archive-keyring.gpg] https://apt.datadoghq.com/ stable datadog-security-cli" \
          | sudo tee /etc/apt/sources.list.d/datadog-security-cli.list
          sudo apt update
          sudo apt install -y datadog-security-cli

          API_BASE="https://api.${EFFECTIVE_SITE}"
          API_STATUS="$(curl -sS -o /tmp/dd_api_validate.json -w '%{http_code}' -H "DD-API-KEY: ${DD_API_KEY}" "${API_BASE}/api/v1/validate")"
          if [ "${API_STATUS}" != "200" ]; then
            cat /tmp/dd_api_validate.json
            exit 1
          fi

          APP_STATUS="$(curl -sS -o /tmp/dd_app_validate.json -w '%{http_code}' -H "DD-API-KEY: ${DD_API_KEY}" -H "DD-APPLICATION-KEY: ${DD_APP_KEY}" "${API_BASE}/api/v2/validate_keys")"
          if [ "${APP_STATUS}" != "200" ]; then
            cat /tmp/dd_app_validate.json
            exit 1
          fi

          export DD_SITE="${EFFECTIVE_SITE}"
          for attempt in 1 2 3; do
            if datadog-security-cli image "${IMAGE_REF}" --dockerfile ./Dockerfile -o json --tag git.commit.sha:${GITHUB_SHA} --tag git.commit.short:${SHORT_SHA} --tag ci.provider:github-actions --tag ci.run_id:${GITHUB_RUN_ID} --tag ci.run_attempt:${GITHUB_RUN_ATTEMPT}; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 20
          done

          {
            echo "## Datadog Digest"
            echo ""
            echo "- Image Digest (Datadog match key): ${RUNTIME_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
