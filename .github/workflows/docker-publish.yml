name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: dd-img-scanner

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_SITE: ${{ secrets.DD_SITE }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        run: |
          CLEAN_USERNAME="$(echo "${DOCKERHUB_USERNAME}" | tr -d '[:space:]')"
          if [ -z "${CLEAN_USERNAME}" ]; then
            echo "DOCKERHUB_USERNAME is empty or missing."
            echo "Set Actions secret DOCKERHUB_USERNAME to your Docker Hub username (for example: airo-swaraj)."
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_TOKEN is empty or missing."
            exit 1
          fi

      - name: Prepare image tags
        id: prep
        run: |
          CLEAN_USERNAME="$(echo "${DOCKERHUB_USERNAME}" | tr -d '[:space:]')"
          IMAGE="${CLEAN_USERNAME}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          FULL_SHA="${GITHUB_SHA}"
          echo "username=${CLEAN_USERNAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha_tag=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "Publishing image: ${IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.prep.outputs.username }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.datadoghq.image.source_path=Dockerfile
          tags: |
            ${{ steps.prep.outputs.image }}:latest
            ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}
            ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.full_sha_tag }}

      - name: Pull image for Datadog scan
        run: docker pull "${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}"

      - name: Capture image digest metadata
        id: image_meta
        run: |
          IMAGE_REF="${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}"
          DIGEST_REF="$(docker image inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}")"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "digest_ref=${DIGEST_REF}" >> "$GITHUB_OUTPUT"

      - name: Install Datadog Security CLI
        run: |
          DD_APT_KEY_URL="https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public"
          curl -fsSL "$DD_APT_KEY_URL" | sudo gpg --dearmor -o /usr/share/keyrings/datadog-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/datadog-archive-keyring.gpg] https://apt.datadoghq.com/ stable datadog-security-cli" \
          | sudo tee /etc/apt/sources.list.d/datadog-security-cli.list
          sudo apt update
          sudo apt install -y datadog-security-cli

      - name: Validate Datadog secrets
        id: dd_prep
        run: |
          if [ -z "${DD_API_KEY}" ]; then
            echo "DD_API_KEY is empty or missing."
            exit 1
          fi
          if [ -z "${DD_APP_KEY}" ]; then
            echo "DD_APP_KEY is empty or missing."
            exit 1
          fi
          EFFECTIVE_SITE="${DD_SITE}"
          if [ -z "${EFFECTIVE_SITE}" ]; then
            EFFECTIVE_SITE="datadoghq.com"
          fi
          EFFECTIVE_SITE="${EFFECTIVE_SITE#https://}"
          EFFECTIVE_SITE="${EFFECTIVE_SITE#http://}"
          EFFECTIVE_SITE="${EFFECTIVE_SITE%/}"

          # Convert common UI hostnames to DD_SITE values expected by APIs/CLI.
          if [ "${EFFECTIVE_SITE}" = "app.datadoghq.com" ]; then
            EFFECTIVE_SITE="datadoghq.com"
          elif [ "${EFFECTIVE_SITE}" = "app.datadoghq.eu" ]; then
            EFFECTIVE_SITE="datadoghq.eu"
          elif [ "${EFFECTIVE_SITE}" = "app.ddog-gov.com" ]; then
            EFFECTIVE_SITE="ddog-gov.com"
          fi

          echo "Using DD_SITE=${EFFECTIVE_SITE}"
          echo "DD_SITE=${EFFECTIVE_SITE}" >> "$GITHUB_ENV"
          echo "site=${EFFECTIVE_SITE}" >> "$GITHUB_OUTPUT"

      - name: Validate Datadog credentials against API
        run: |
          API_BASE="https://api.${{ steps.dd_prep.outputs.site }}"
          API_STATUS="$(curl -sS -o /tmp/dd_api_validate.json -w '%{http_code}' -H "DD-API-KEY: ${DD_API_KEY}" "${API_BASE}/api/v1/validate")"
          if [ "${API_STATUS}" != "200" ]; then
            echo "Datadog API key validation failed (status ${API_STATUS}) at ${API_BASE}."
            echo "Check DD_API_KEY and DD_SITE."
            cat /tmp/dd_api_validate.json
            exit 1
          fi

          APP_STATUS="$(curl -sS -o /tmp/dd_app_validate.json -w '%{http_code}' -H "DD-API-KEY: ${DD_API_KEY}" -H "DD-APPLICATION-KEY: ${DD_APP_KEY}" "${API_BASE}/api/v2/validate_keys")"
          if [ "${APP_STATUS}" != "200" ]; then
            echo "Datadog application key validation failed (status ${APP_STATUS}) at ${API_BASE}."
            echo "Check DD_APP_KEY, DD_SITE, and ensure the app key has appsec_vm_read scope."
            cat /tmp/dd_app_validate.json
            exit 1
          fi

      - name: Scan image and upload report to Datadog
        run: |
          IMAGE_REF="${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}"
          REPORT_FILE="datadog-scan-${GITHUB_SHA}.json"
          for attempt in 1 2 3; do
            echo "Datadog scan attempt ${attempt} for ${IMAGE_REF}"
            if datadog-security-cli image "${IMAGE_REF}" --dockerfile ./Dockerfile --output json | tee "${REPORT_FILE}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Scan failed, retrying after key propagation wait..."
              sleep 20
            fi
          done
          echo "Datadog scan failed after retries. Check DD_SITE, DD_API_KEY, DD_APP_KEY, and app key scope appsec_vm_read."
          exit 1

      - name: Upload Datadog scan report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datadog-scan-${{ github.sha }}
          path: datadog-scan-${{ github.sha }}.json
          if-no-files-found: warn

      - name: Publish commit mapping summary
        if: always()
        run: |
          {
            echo "## Commit to Image Mapping"
            echo ""
            echo "- Commit SHA: ${{ github.sha }}"
            echo "- Short SHA Tag: ${{ steps.prep.outputs.sha_tag }}"
            echo "- Image Tag (short): ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}"
            echo "- Image Tag (full): ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.full_sha_tag }}"
            echo "- Image Digest: ${{ steps.image_meta.outputs.digest_ref }}"
            echo "- Datadog Site: ${{ steps.dd_prep.outputs.site }}"
            echo ""
            echo "Use commit SHA or image digest above to search findings in Datadog Cloud Security Vulnerabilities."
          } >> "$GITHUB_STEP_SUMMARY"
