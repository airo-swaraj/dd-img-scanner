name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: dd-img-scanner

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_SITE: ${{ secrets.DD_SITE }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        run: |
          CLEAN_USERNAME="$(echo "${DOCKERHUB_USERNAME}" | tr -d '[:space:]')"
          if [ -z "${CLEAN_USERNAME}" ]; then
            echo "DOCKERHUB_USERNAME is empty or missing."
            echo "Set Actions secret DOCKERHUB_USERNAME to your Docker Hub username (for example: airo-swaraj)."
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_TOKEN is empty or missing."
            exit 1
          fi

      - name: Prepare image tags
        id: prep
        run: |
          CLEAN_USERNAME="$(echo "${DOCKERHUB_USERNAME}" | tr -d '[:space:]')"
          IMAGE="${CLEAN_USERNAME}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "username=${CLEAN_USERNAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Publishing image: ${IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.prep.outputs.username }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.datadoghq.image.source_path=Dockerfile
          tags: |
            ${{ steps.prep.outputs.image }}:latest
            ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}

      - name: Pull image for Datadog scan
        run: docker pull "${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}"

      - name: Install Datadog Security CLI
        run: |
          DD_APT_KEY_URL="https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public"
          curl -fsSL "$DD_APT_KEY_URL" | sudo gpg --dearmor -o /usr/share/keyrings/datadog-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/datadog-archive-keyring.gpg] https://apt.datadoghq.com/ stable datadog-security-cli" \
          | sudo tee /etc/apt/sources.list.d/datadog-security-cli.list
          sudo apt update
          sudo apt install -y datadog-security-cli

      - name: Validate Datadog secrets
        run: |
          if [ -z "${DD_API_KEY}" ]; then
            echo "DD_API_KEY is empty or missing."
            exit 1
          fi
          if [ -z "${DD_APP_KEY}" ]; then
            echo "DD_APP_KEY is empty or missing."
            exit 1
          fi
          if [ -z "${DD_SITE}" ]; then
            echo "DD_SITE not set. Falling back to datadoghq.com"
            echo "DD_SITE=datadoghq.com" >> "$GITHUB_ENV"
          fi

      - name: Scan image and upload report to Datadog
        run: |
          datadog-security-cli image "${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.sha_tag }}" --dockerfile ./Dockerfile
