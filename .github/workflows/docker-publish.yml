name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: dd-img-scanner

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_SITE: ${{ secrets.DD_SITE }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image references
        id: prep
        run: |
          set -euo pipefail
          CLEAN_USERNAME="$(echo "${DOCKERHUB_USERNAME}" | tr -d '[:space:]')"
          if [ -z "${CLEAN_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is missing."
            exit 1
          fi

          IMAGE="${CLEAN_USERNAME}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          FULL_SHA="${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        run: |
          set -euo pipefail
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${CLEAN_USERNAME}" --password-stdin

      - name: Build and push image
        run: |
          set -euo pipefail
          docker buildx build \
            --push \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "com.datadoghq.image.source_path=Dockerfile" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "com.datadoghq.image.source_path=Dockerfile" \
            -t "${{ steps.prep.outputs.image }}:latest" \
            -t "${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.short_sha }}" \
            -t "${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.full_sha }}" \
            .

      - name: Datadog image scan
        uses: ./.github/actions/datadog-image-scan
        with:
          image_ref: ${{ steps.prep.outputs.image_ref }}
          dockerfile_path: ./Dockerfile
          commit_sha: ${{ github.sha }}
          short_sha: ${{ steps.prep.outputs.short_sha }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
